# Paid-audio block — no login/membership. Every file under these two
# prefixes goes through one edge function that serves only the free
# sample chapters/episodes (1–2 per title) and returns 403 for the rest.
# /audio/music/** (Sumnu Radio) stays public.

[[edge_functions]]
  function = "protect-paid-audio"
  path = "/audio/audiobooks/*"

[[edge_functions]]
  function = "protect-paid-audio"
  path = "/audio/series/*"

# Retired membership pages → Audiobooks (Buy buttons live there).
[[redirects]]
  from = "/unlock.html"
  to = "/audiobooks.html"
  status = 301
  force = true

[[redirects]]
  from = "/unlock"
  to = "/audiobooks.html"
  status = 301
  force = true

[[redirects]]
  from = "/login.html"
  to = "/audiobooks.html"
  status = 301
  force = true

[[redirects]]
  from = "/login"
  to = "/audiobooks.html"
  status = 301
  force = true

[[redirects]]
  from = "/vip-audio-dramas_netflix_mobile.html"
  to = "/audiobooks.html"
