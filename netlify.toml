# Paid-audio block — no login/membership. Every file under these two
# prefixes goes through one edge function that serves only the free
# sample chapters/episodes (1–2 per title) and returns 403 for the rest.
# /audio/music/** (Sumnu Radio) stays public.

# Case-insensitive on purpose: Netlify serves /AUDIO/Series/... from the
# same files, so a plain lowercase path match could be bypassed.
[[edge_functions]]
  function = "protect-paid-audio"
  pattern = '^/+[aA][uU][dD][iI][oO]/+(?:[aA][uU][dD][iI][oO][bB][oO][oO][kK][sS]|[sS][eE][rR][iI][eE][sS])(?:/.*)?$'

# Retired membership pages → Audiobooks (Buy buttons live there).
[[redirects]]
  from = "/unlock.html"
  to = "/audiobooks.html"
  status = 301
  force = true

[[redirects]]
  from = "/unlock"
  to = "/audiobooks.html"
  status = 301
  force = true

