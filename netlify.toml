# Paid-audio block — no login/membership. Every file under these two
# prefixes goes through one edge function that serves only the free
# sample chapters/episodes (1–2 per title) and returns 403 for the rest.
# /audio/music/** (Sumnu Radio) stays public.

# Case-insensitive on purpose: Netlify serves /AUDIO/Series/... from the
# same files, so a plain lowercase path match could be bypassed.
[[edge_functions]]
  function = "protect-paid-audio"
  pattern = '^/+[aA][uU][dD][iI][oO]/+(?:[aA][uU][dD][iI][oO][bB][oO][oO][kK][sS]|[sS][eE][rR][iI][eE][sS])(?:/.*)?$'

# Per-audiobook link previews (Open Graph / Twitter) for shared player links.
# Crawlers don't run JS, so the edge function writes the <head> meta per ?slug.
# Share URL: /listen/<slug> (crawlers: per-book meta; people: 302 to the player).
[[edge_functions]]
  function = "og-audiobook"
  path = "/listen/*"

[[edge_functions]]
  function = "og-audiobook"
  path = "/listen"

[[edge_functions]]
  function = "og-audiobook"
  path = "/audiobook.html"

[[edge_functions]]
  function = "og-audiobook"
  path = "/audiobook"

# Home while a book plays (/?play=<slug>) and list-page ?slug= links.
[[edge_functions]]
  function = "og-audiobook"
  path = "/"

[[edge_functions]]
  function = "og-audiobook"
  path = "/index.html"

[[edge_functions]]
  function = "og-audiobook"
  path = "/audiobooks.html"

[[edge_functions]]
  function = "og-audiobook"
  path = "/audiobooks"

# Retired membership pages → Audiobooks (Buy buttons live there).
[[redirects]]
  from = "/unlock.html"
  to = "/audiobooks.html"
  status = 301
  force = true

[[redirects]]
  from = "/unlock"
  to = "/audiobooks.html"
  status = 301
  force = true

